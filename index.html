<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Misinformation Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 2rem;
        }
        textarea {
            resize: vertical;
            min-height: 150px;
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="antialiased flex items-center justify-center min-h-screen">
    <div class="container bg-slate-800 rounded-2xl shadow-xl p-8 space-y-6 border border-slate-700">
        <div class="text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold text-blue-400 mb-2">
                AI Misinformation Checker
            </h1>
            <p class="text-slate-300">
                Paste any text or a URL below and let our AI model, backed by Google Search, analyze it for accuracy.
            </p>
        </div>

        <div class="space-y-4">
            <textarea
                id="inputText"
                class="w-full p-4 text-slate-200 bg-slate-700 rounded-xl border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                placeholder="Enter the text or URL you want to check..."
            ></textarea>

            <button
                id="checkButton"
                class="w-full flex items-center justify-center bg-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:bg-blue-700 transition-colors"
                onclick="checkMisinformation()"
            >
                Check for Misinformation
            </button>
        </div>

        <div id="loading" class="hidden flex justify-center items-center py-4">
            <div class="loading-spinner"></div>
            <p class="ml-4 text-slate-400">Analyzing content...</p>
        </div>

        <div id="results" class="space-y-4 pt-4">
            <!-- Results will be displayed here -->
        </div>
    </div>

    <script>
        const API_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent';
        const apiKey = "YOURAPIKEY"; 
        const inputTextarea = document.getElementById('inputText');
        const checkButton = document.getElementById('checkButton');
        const loadingDiv = document.getElementById('loading');
        const resultsDiv = document.getElementById('results');

        async function checkMisinformation() {
            const userText = inputTextarea.value.trim();
            if (!userText) {
                alertMessage("Please enter some text or a URL to check.");
                return;
            }

            // Show loading state
            resultsDiv.innerHTML = '';
            loadingDiv.classList.remove('hidden');
            checkButton.disabled = true;

            const isUrl = userText.startsWith('http://') || userText.startsWith('https://');

            let promptText;
            if (isUrl) {
                promptText = `Please fact-check the content found at the following URL: ${userText}.`;
            } else {
                promptText = `Please fact-check the following text: "${userText}"`;
            }

            const systemPrompt = `You are a professional fact-checker. Your task is to analyze the user-provided text or URL content for factual accuracy and potential misinformation. Use external sources to verify claims.

Your response MUST follow this structure:
1.  **Verdict:** Provide a clear classification: "Verified Information", "Misleading Information", or "Unverified Claim".
2.  **Analysis:** Explain your reasoning. State which parts of the text are true, false, or unproven. Provide a brief, concise explanation.`;

            const payload = {
                contents: [{ parts: [{ text: promptText }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                tools: [{ "google_search": {} }],
                generationConfig: { temperature: 0.2, topP: 0.95 }
            };

            const maxRetries = 3;
            let retries = 0;
            let response = null;
            let success = false;

            while (retries < maxRetries && !success) {
                try {
                    response = await fetch(`${API_ENDPOINT}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        success = true;
                    } else if (response.status === 429) {
                        retries++;
                        const delay = Math.pow(2, retries) * 1000;
                        await new Promise(res => setTimeout(res, delay));
                    } else {
                        throw new Error(`API error: ${response.statusText}`);
                    }
                } catch (error) {
                    console.error("Fetch error:", error);
                    retries++;
                    const delay = Math.pow(2, retries) * 1000;
                    await new Promise(res => setTimeout(res, delay));
                }
            }

            // Hide loading state and re-enable button
            loadingDiv.classList.add('hidden');
            checkButton.disabled = false;

            if (!success || !response || !response.ok) {
                displayError("Failed to connect to the AI. Please try again later.");
                return;
            }

            try {
                const result = await response.json();
                const candidate = result?.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const text = candidate.content.parts[0].text;
                    let sources = [];

                    const groundingMetadata = candidate.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        sources = groundingMetadata.groundingAttributions
                            .map(attribution => ({
                                uri: attribution.web?.uri,
                                title: attribution.web?.title,
                            }))
                            .filter(source => source.uri && source.title);
                    }

                    displayResults(text, sources);
                } else {
                    displayError("The AI did not provide a valid response. Please try a different query.");
                }
            } catch (error) {
                console.error("Error parsing response:", error);
                displayError("There was an issue processing the AI's response.");
            }
        }

        function displayResults(text, sources) {
            resultsDiv.innerHTML = `
                <div class="bg-slate-700 p-6 rounded-xl border border-slate-600 shadow-inner space-y-4">
                    <p class="text-xl font-semibold text-blue-300">Analysis Result</p>
                    <div class="prose max-w-none text-slate-200">
                        ${marked.parse(text)}
                    </div>
                </div>
            `;
            if (sources.length > 0) {
                const sourcesHtml = sources.map(source => `
                    <a href="${source.uri}" target="_blank" rel="noopener noreferrer" class="block text-sm text-blue-400 hover:underline">
                        ${source.title}
                    </a>
                `).join('');

                resultsDiv.innerHTML += `
                    <div class="bg-slate-700 p-4 rounded-xl border border-slate-600 shadow-inner">
                        <p class="text-lg font-semibold text-slate-300 mb-2">Sources</p>
                        ${sourcesHtml}
                    </div>
                `;
            }
        }

        function displayError(message) {
            resultsDiv.innerHTML = `
                <div class="bg-red-900 text-red-300 p-4 rounded-xl border border-red-700">
                    <p class="font-bold">Error:</p>
                    <p>${message}</p>
                </div>
            `;
        }

        // Custom alert function
        function alertMessage(message) {
            resultsDiv.innerHTML = `
                <div class="bg-yellow-900 text-yellow-300 p-4 rounded-xl border border-yellow-700">
                    <p class="font-bold">Notice:</p>
                    <p>${message}</p>
                </div>
            `;
        }
        
        // This is a minimal markdown parser to render the bold text from the model's response.
        const marked = {
            parse: (text) => {
                let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\n/g, '<br>');
                return html;
            }
        };

    </script>
</body>
</html>
